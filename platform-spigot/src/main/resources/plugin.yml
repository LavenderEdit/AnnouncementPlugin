name: AdvancedAnnouncer
main: dev.studio.announcer.spigot.bootstrap.AdvancedAnnouncerPlugin
version: ${version}
api-version: '1.21'
authors:
  - Juan S Pimentel Lalangui
  - Bryan A Vidal Crispin
description: Modern multi-channel announcement engine for Paper, Spigot, and Folia-ready deployments.
website: https://github.com/StudiosTKOH

commands:
  announcer:
    description: AdvancedAnnouncer administration command.
    usage: /announcer <list|create|delete|toggle|send|preview|reload|debug|version|editor>
    aliases: [aa, advancedannouncer]

permissions:
  announcer.admin:
    description: Full access to AdvancedAnnouncer administration commands.
    default: op
  announcer.editor:
    description: Allows opening the in-game announcement editor.
    default: op
  announcer.migrate:
    description: Allows migrating legacy WelcomeDonations configuration.
    default: op
  announcer.reload:
    description: Allows reloading AdvancedAnnouncer configuration.
    default: op
  announcer.send:
    description: Allows manually sending announcements.
    default: op
  announcer.preview:
    description: Allows previewing announcements.
    default: op
  announcer.toggle:
    description: Allows toggling announcements.
    default: op
  announcer.debug:
    description: Allows viewing AdvancedAnnouncer debug state.
    default: op
  announcer.redis:
    description: Allows Redis diagnostic commands.
    default: op
  announcer.discord:
    description: Allows Discord diagnostic commands.
    default: op
  announcer.receive.alert:
    description: Allows receiving alert announcements.
    default: true
  announcer.receive.vip:
    description: Allows receiving VIP announcements.
    default: false
  announcer.bypass.cooldown:
    description: Bypasses announcement cooldowns.
    default: op

softdepend:
  - PlaceholderAPI
  - SkinsRestorer
  - DiscordSRV
  - ProtocolLib
  - PacketEvents
