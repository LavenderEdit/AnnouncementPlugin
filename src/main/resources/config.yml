# @authors Lavender & VaCris
# Rol de este servidor en tu red: AUTH | SPAWN | SURVIVAL
server-role: SPAWN

#Bienvenida formato
welcome:
  enabled: true
  first-join:
    chat: "&aBienvenido &e%player% &aa nuestra comunidad! &7(primera vez)"
    title:
      enabled: true
      main: "&a¡Bienvenido!"
      sub: "&fDisfruta tu estadía, %player%"
      fade-in: 10
      stay: 50
      fade-out: 10
    sound: "ENTITY_PLAYER_LEVELUP"
  rejoin:
    chat: "&a¡%player% ha entrado! &7Salúdenlo 👋"
    title:
      enabled: false
    sound: "UI_TOAST_CHALLENGE_COMPLETE"

#Donaciones formato
donations:
  enabled: true
  format: "&6[Donación] &e%player% &fapoyó con &b%item% &f(&a%monto%&f) ¡Gracias!"
  sound: "ENTITY_VILLAGER_CELEBRATE"
  proxy-forward:
    enabled: false  
    target-servers: ["spawn", "survival"]
    
#Rango formato
ranks:
  enabled: true
  format: "&6[Rango] &e%player% &fha comprado el rango &b%rank% ¡Disfruta tu nueva ventaja!"
  sound: "ENTITY_PLAYER_LEVELUP"
  proxy-forward:
    enabled: false
    target-servers: ["spawn", "survival"]
  # Lista opcional de rangos permitidos (si no usas packages)
  # Ejemplo:
  # allowed-ranks: ["VIP", "MVP+"]

# Aquí puedes definir paquetes que combinan mensaje + comando a ejecutar.
# Ejemplo: vender rangos o ítems específicos desde la tienda web.
# Formato de ejemplo incluido para referencia.
packages:
  #Tipo rango
  ##rangoVip:
  ##type: rank
  ##rank: "Vip"
  ##broadcast-format: "&6[Rango] &e%player% &fcompró el rango &b%rank%"
  ##give-command: "lp user %player% parent add Vip"
  ##auto-forward-proxy: true
    
messages:
  disabled-on-auth: "&7[WD] Este plugin está deshabilitado en servidores de AUTH."
  no-permission: "&cNo tienes permiso."
  usage-donate: "&eUso: /donatebroadcast <jugador> <paquete|motivo> [monto]"
